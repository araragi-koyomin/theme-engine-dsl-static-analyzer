intellij {
    plugins = []
}

configurations {
    antlr4
}

dependencies {
    implementation 'com.google.code.gson:gson:2.9.0'
    implementation 'com.ezylang:EvalEx:3.7.0'
    antlr4 'org.antlr:antlr4:4.13.1'
    implementation 'org.antlr:antlr4-runtime:4.13.1'
    implementation project(":antlr4-intellij-adaptor")
    compileOnly 'org.projectlombok:lombok:1.18.22'
    annotationProcessor 'org.projectlombok:lombok:1.18.22'
    testCompileOnly 'org.projectlombok:lombok:1.18.22'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.22'

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.3'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.9.3'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.9.3'
    testImplementation 'junit:junit:4.13.2'
    testRuntimeOnly 'org.junit.vintage:junit-vintage-engine:5.9.3'
}

def generatedRootDir = 'build/generated-src/antlr/main'

task generateDslExpressionGrammar(type: JavaExec) {
    description 'Generate ANTLR4 parser for DslExpression grammar'
    group 'antlr'
    classpath = configurations.antlr4
    mainClass = 'org.antlr.v4.Tool'
    args = [
            '-package', 'com.huawei.theme.analysis.core.expression.generated',
            '-visitor', '-no-listener',
            '-o', file("${generatedRootDir}/com/huawei/theme/analysis/core/expression/generated").absolutePath,
            file('src/main/java/com/huawei/theme/analysis/core/expression/grammar/DslExpression.g4').absolutePath
    ]
}

task generateDslRuleConditionGrammar(type: JavaExec) {
    description 'Generate ANTLR4 parser for DslRuleCondition grammar'
    group 'antlr'
    classpath = configurations.antlr4
    mainClass = 'org.antlr.v4.Tool'
    args = [
            '-package', 'com.huawei.theme.analysis.core.ruledsl.generated',
            '-visitor', '-no-listener',
            '-o', file("${generatedRootDir}/com/huawei/theme/analysis/core/ruledsl/generated").absolutePath,
            file('src/main/java/com/huawei/theme/analysis/core/ruledsl/grammar/DslRuleCondition.g4').absolutePath
    ]
}

sourceSets {
    main.java.srcDirs generatedRootDir
}

compileJava.dependsOn generateDslExpressionGrammar, generateDslRuleConditionGrammar

tasks.matching { it.name == 'prepareKotlinBuildScriptModel' || it.name == 'ideaModule' }.configureEach {
    dependsOn 'generateDslExpressionGrammar', 'generateDslRuleConditionGrammar'
}

task checkCoreIntellijDependency {
    description 'Verify core package has no IntelliJ SDK imports (Architecture §4 Core-Plugin isolation)'
    group 'verification'

    doLast {
        def violations = []
        def corePaths = [
            'src/main/java/com/huawei/theme/analysis/core',
            'src/test/java/com/huawei/theme/analysis/core'
        ]

        corePaths.each { corePath ->
            def coreDir = file(corePath)
            if (!coreDir.exists()) {
                return
            }
            coreDir.eachFileRecurse { f ->
                if (f.name.endsWith('.java')) {
                    f.eachLine { line, lineNum ->
                        if (line.trim().startsWith('import com.intellij.')) {
                            violations.add("${f.absolutePath}:${lineNum}: ${line.trim()}")
                        }
                    }
                }
            }
        }

        if (!violations.isEmpty()) {
            logger.error("Core IntelliJ dependency violations found:")
            violations.each { v -> logger.error("  " + v) }
            throw new GradleException(
                "Core package must not import com.intellij.* (${violations.size()} violation(s) found).\n" +
                "See Architecture.md §4: Core-Plugin isolation rule."
            )
        }
        logger.lifecycle("checkCoreIntellijDependency: PASSED (0 violations)")
    }
}

check.dependsOn checkCoreIntellijDependency

apply plugin: 'jacoco'

jacoco {
    toolVersion = '0.8.11'
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    reports {
        xml.required = true
        html.required = true
    }
}

task buildFatJar(type: Jar) {
    group 'build'
    description 'Build CLI fat jar containing core layer + GSON + ANTLR4 runtime'
    archiveFileName = 'dsl-analyzer.jar'
    destinationDirectory = file("$buildDir/cli")

    dependsOn compileJava, processResources, checkCoreIntellijDependency

    manifest {
        attributes 'Main-Class': 'com.huawei.theme.analysis.core.cli.CliMain'
    }

    from(sourceSets.main.output.classesDirs) {
        include 'com/huawei/theme/analysis/core/**'
    }

    from(sourceSets.main.output.resourcesDir) {
        include 'rules/**'
        include 'functions/**'
        exclude 'META-INF/**'
    }

    from {
        configurations.runtimeClasspath.filter { file ->
            file.name.contains('gson') || file.name.contains('antlr4-runtime') || file.name.contains('EvalEx')
        }.collect { it.isDirectory() ? it : zipTree(it) }
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

task e2e(type: Test) {
    group = 'verification'
    description = 'Fat-jar subprocess E2E with golden matching (L4)'

    dependsOn buildFatJar
    systemProperty 'fatJar.path', layout.buildDirectory.file('cli/dsl-analyzer.jar').get().asFile.absolutePath

    include '**/FatJarSubprocessE2ETest*'
    exclude '**/GoldenDiagnosticMatchTest*'
    exclude '**/GoldenMatcherTest*'
    exclude '**/GoldenExpectationParserTest*'
    exclude '**/FixtureCoverageTest*'

    useJUnitPlatform()
    shouldRunAfter test

    reports {
        junitXml.outputLocation = layout.buildDirectory.dir('test-results/e2e')
        html.outputLocation = layout.buildDirectory.dir('reports/tests/e2e')
    }
}