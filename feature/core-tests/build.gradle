// Plain Java subproject (no org.jetbrains.intellij plugin) that hosts core
// unit tests so they run under the default system classloader, letting the
// JaCoCo agent record real coverage. Excluded from the root subprojects{}
// intellij-plugin block in build.gradle. java/sourceSets are inherited from
// the root allprojects/subprojects blocks.
apply plugin: 'jacoco'

jacoco {
    toolVersion = '0.8.11'
}

dependencies {
    // Provides the compiled core classes under test.
    implementation project(':feature:analysis')
    implementation 'com.google.code.gson:gson:2.9.0'
    implementation 'org.antlr:antlr4-runtime:4.13.1'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.3'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.9.3'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.9.3'
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    // The classes under test live in :feature:analysis main output (core-tests
    // has no main source of its own). Point the report at analysis's classes
    // and sources so coverage for the exercised core classes is rendered.
    classDirectories.setFrom(project(':feature:analysis').sourceSets.main.output.classesDirs)
    sourceDirectories.setFrom(project(':feature:analysis').sourceSets.main.allSource)
    reports {
        xml.required = true
        html.required = true
    }
}
