// IntelliJ LSP client plugin module. Parallel to the VS Code client
// (feature/clients/vscode): a standalone, independently-built IntelliJ plugin
// that launches the :feature:lsp server (fat jar) as a child process over
// stdio and bridges diagnostics / completion / hover / codeAction /
// semantic tokens to IntelliJ.
//
// Depends on :feature:analysis (the core engine) only for
// core.expression.ExpressionParser, used by the var-reference contributor.
// The server runs in a separate process; its fat jar is staged into the
// plugin lib/ by prepareSandbox (not a compile dependency).

intellij {
    plugins = []
}

dependencies {
    implementation project(':feature:analysis')
    implementation 'org.eclipse.lsp4j:org.eclipse.lsp4j:0.21.2'

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.3'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.9.3'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.9.3'
}

test {
    useJUnitPlatform()
}

// Ship the LSP server fat jar inside the plugin lib/ directory so the client
// can launch it via ProcessBuilder. Mirrors the wiring that used to live in
// :feature:analysis before the module extraction.
prepareSandbox.dependsOn ':feature:lsp:buildLspFatJar'
prepareSandbox.doLast {
    def libDir = file("${buildDir}/idea-sandbox/plugins/${project.name}/lib")
    libDir.mkdirs()
    copy {
        from project(':feature:lsp').tasks.named('buildLspFatJar')
        into libDir
    }
    // :feature:analysis is a dependency for the core engine, but it is ALSO
    // main's native IntelliJ plugin module, so its jar carries a
    // META-INF/plugin.xml (the native plugin descriptor) with the same id as
    // this LSP client. IntelliJ scans lib/*.jar for plugin descriptors and
    // would load the native one, shadowing this LSP client's plugin.xml.
    // Repack analysis-*.jar without its own plugin descriptor / icon /
    // color scheme so only this module's plugin.xml describes the plugin.
    stripPluginDescriptor(libDir)
}

private void stripPluginDescriptor(File libDir) {
    if (libDir == null || !libDir.isDirectory()) {
        return
    }
    libDir.listFiles()?.findAll { it.name.startsWith('analysis-') && it.name.endsWith('.jar') }?.each { File jarFile ->
        def tmp = new File(jarFile.parentFile, jarFile.name + '.tmp')
        def zin = new java.util.zip.ZipFile(jarFile)
        def zout = new java.util.zip.ZipOutputStream(tmp.newOutputStream())
        try {
            def entry = zin.entries()
            while (entry.hasMoreElements()) {
                def e = entry.nextElement()
                def n = e.name
                if (n == 'META-INF/plugin.xml'
                        || n == 'META-INF/pluginIcon.svg'
                        || n.startsWith('META-INF/pluginIcon.svg.')
                        || n.startsWith('colorSchemes/')) {
                    continue
                }
                zout.putNextEntry(new java.util.zip.ZipEntry(e.name))
                if (!e.directory) {
                    zout.write(zin.getInputStream(e).bytes)
                }
                zout.closeEntry()
            }
        } finally {
            zout.close()
            zin.close()
        }
        jarFile.delete()
        tmp.renameTo(jarFile)
    }
}
